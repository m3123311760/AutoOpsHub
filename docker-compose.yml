# 本地开发与手动验证依赖（非生产编排方案）
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autoopshub
      MYSQL_USER: autoopshub
      MYSQL_PASSWORD: autoopshub
    ports:
      - "3306:3306"
    volumes:
      - ./databases-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "AutoOpsHub"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "admin"
    ports:
      - "389:389"
    command: ["--copy-service"]
